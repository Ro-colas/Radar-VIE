name: VIE Radar
on:
  schedule: [{cron: "0 6 * * 1-5"}]   # chaque matin en semaine
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install requests
          SCRIPT=$(find . -type f -iname 'vie*radar*.py*' | head -n 1)
          if [ -z "$SCRIPT" ]; then echo "Aucun fichier vie_radar.py dans le depot. Contenu :"; ls -R; exit 1; fi
          echo "Script utilise : $SCRIPT"
          python "$SCRIPT"
      - run: mkdir site && mv vie_offres.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - uses: actions/deploy-pages@v4
